[package]
name = "ftnl-desktop-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Native Rust desktop companion for secure File Tunnel transfers"
license = "MIT"
repository = "https://github.com/file-tunnel/ftnl-desktop-app.rs"
publish = false

[lib]
name = "ftnl_desktop"
path = "src/lib.rs"

[[bin]]
name = "ftnl-desktop"
path = "src/main.rs"
required-features = ["native-ui"]

[features]
default = ["native-ui"]
native-ui = [
  "dep:arboard",
  "dep:eframe",
  "dep:tokio",
  "dep:tray-icon",
  "ftnl-ui-components/egui",
]

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ftnl-client = { git = "https://github.com/file-tunnel/ftnl-clients.git", rev = "a93812ff94e604b2ccd7736c2e1d8ae8bbea2978" }
ftnl-interfaces = { git = "https://github.com/file-tunnel/ftnl-interfaces.git", rev = "bd1c7cb0b014c94fba75ea61b8cc9c0c36b03362" }
ftnl-ui-components = { git = "https://github.com/file-tunnel/ftnl-ui-components.git", rev = "3f71c269ddf6356fdf176ae5c79726ec2dcad3f1", default-features = false }
hkdf = "0.12"
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "64a4ee0ed839a8de7e9ba2588899a24e25b05a65" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "2.0.1", features = ["getrandom", "static_secrets"] }
zeroize = "1"

arboard = { version = "3.6.1", optional = true, default-features = false }
eframe = { version = "0.31", optional = true, default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
tokio = { version = "1", optional = true, features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.2", optional = true, default-features = false, features = ["gtk"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.24.2", optional = true, default-features = false }

[lints.rust]
unsafe_code = "forbid"
